<meta charset="utf-8" />
<title>Logarytmy w 4 lekcjach</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Condensed:wght@600;800&family=STIX+Two+Text:wght@400;600&display=swap"
/>
<style>
  /* Układ: jedna kolumna jak zeszyt; zielony pasek u góry, lista lekcji, potem lekcja: wyprowadzenie zasady obrazkiem, przykład, ćwiczenia z klawiaturą liczb, test. */
  :root {
    --bg: #f1f5f1;
    --surface: #ffffff;
    --ink: #13241b;
    --muted: #56685d;
    --line: #d3ddd6;
    --pitch: #1d7543;
    --pitch-ink: #ffffff;
    --pitch-soft: #e0efe5;
    --yellow: #e9b21c;
    --yellow-soft: #fcf2d2;
    --on-yellow: #231b02;
    --red: #c23a3a;
    --red-soft: #f8e0df;
    --blue: #2c67b0;
    --display: "Saira Condensed", "Arial Narrow", sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
    --math: "STIX Two Text", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1611;
      --surface: #15221a;
      --ink: #e5eee8;
      --muted: #9bb0a3;
      --line: #293a30;
      --pitch: #37b06a;
      --pitch-ink: #07130b;
      --pitch-soft: #1a3424;
      --yellow: #f0c23e;
      --yellow-soft: #382f14;
      --on-yellow: #231b02;
      --red: #ff7c72;
      --red-soft: #3b1d1b;
      --blue: #6fa8e8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1611;
    --surface: #15221a;
    --ink: #e5eee8;
    --muted: #9bb0a3;
    --line: #293a30;
    --pitch: #37b06a;
    --pitch-ink: #07130b;
    --pitch-soft: #1a3424;
    --yellow: #f0c23e;
    --yellow-soft: #382f14;
    --on-yellow: #231b02;
    --red: #ff7c72;
    --red-soft: #3b1d1b;
    --blue: #6fa8e8;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 40px;
  }
  h1,
  h2,
  h3 {
    font-family: var(--display);
    line-height: 1.1;
    text-wrap: balance;
    margin: 0;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  button:focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 2px;
  }
  .m {
    font-family: var(--math);
    font-size: 1.12em;
    white-space: nowrap;
  }
  .m sup {
    font-size: 0.68em;
    line-height: 0;
  }
  .fr {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    font-size: 0.86em;
    line-height: 1.15;
    margin: 0 0.08em;
  }
  .fr > span:first-child {
    border-bottom: 1.5px solid currentColor;
    padding: 0 0.2em;
  }
  .fr > span:last-child {
    padding: 0 0.2em;
  }
  sup .fr {
    font-size: 0.95em;
  }
  .pa {
    font-size: 1.45em;
    font-weight: 400;
    vertical-align: -0.14em;
    line-height: 0;
  }
  .rt {
    white-space: nowrap;
  }
  .rs {
    margin-right: -0.05em;
  }
  .rx {
    border-top: 1.5px solid currentColor;
    padding: 0 0.12em;
  }
  .ri {
    font-size: 0.6em;
    vertical-align: 0.95em;
    margin-right: -0.35em;
  }

  .band {
    background: var(--pitch);
    color: var(--pitch-ink);
  }
  .band .wrap {
    padding-block: 22px 22px;
  }
  .kicker {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 14px;
    opacity: 0.9;
  }
  .band h1 {
    font-size: 42px;
    font-weight: 800;
    margin-top: 4px;
  }
  .band p {
    margin: 8px 0 0;
    max-width: 36ch;
  }
  .xpbar {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    font-family: var(--display);
    font-size: 18px;
    font-weight: 600;
  }
  .xpbar b {
    font-size: 26px;
    font-weight: 800;
  }

  section {
    margin-top: 26px;
  }
  section > h2 {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .flow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
  }
  .flow span {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 99px;
    padding: 4px 12px;
  }
  .flow i {
    font-style: normal;
    color: var(--muted);
  }
  .note {
    color: var(--muted);
    font-size: 15px;
    margin: 8px 0 0;
  }
  .table {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface);
  }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    text-align: left;
    background: none;
    border-left: 0;
    border-right: 0;
    border-bottom: 0;
    width: 100%;
  }
  .row:first-child {
    border-top: 0;
  }
  .row .nr {
    font-family: var(--display);
    font-weight: 800;
    font-size: 30px;
    color: var(--pitch);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .row .tt {
    min-width: 0;
  }
  .row .tt b {
    display: block;
    font-size: 17px;
  }
  .row .tt small {
    color: var(--muted);
    font-size: 14px;
  }
  .row.biezaca {
    background: var(--pitch-soft);
  }
  .chip {
    font-family: var(--display);
    font-weight: 600;
    font-size: 15px;
    padding: 3px 10px;
    border-radius: 99px;
    white-space: nowrap;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .chip.done {
    background: var(--pitch);
    color: var(--pitch-ink);
    border-color: var(--pitch);
  }
  .chip.go {
    border-color: var(--pitch);
    color: var(--pitch);
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .topic {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .topic b {
    display: block;
  }
  .topic small {
    color: var(--muted);
  }
  details.sciaga {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  details.sciaga summary {
    font-family: var(--display);
    font-weight: 800;
    font-size: 20px;
    cursor: pointer;
  }
  details.sciaga ul {
    margin: 10px 0 0;
    padding-left: 20px;
  }
  details.sciaga li {
    margin: 6px 0;
  }
  .reset {
    margin-top: 26px;
    color: var(--muted);
    font-size: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .linkbtn {
    background: none;
    border: 0;
    text-decoration: underline;
    color: var(--muted);
    padding: 4px 0;
  }

  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--pitch);
    color: var(--pitch-ink);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--pitch);
  }
  .top .wrap {
    padding-block: 10px 10px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .top .ttl {
    flex: 1;
    min-width: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .clock {
    font-family: var(--display);
    font-weight: 600;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  .x {
    background: none;
    border: 1.5px solid currentColor;
    border-radius: 8px;
    padding: 2px 10px;
    font-weight: 700;
  }
  .prog {
    height: 6px;
    background: var(--pitch-soft);
  }
  .prog i {
    display: block;
    height: 100%;
    background: var(--yellow);
    transition: width 0.3s;
  }
  .stage {
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--pitch);
    font-size: 15px;
    margin-top: 18px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-top: 8px;
  }
  .prompt {
    font-size: 19px;
  }
  .steps {
    list-style: none;
    padding: 0;
    margin: 12px 0 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .steps li {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 10px;
    align-items: start;
    padding: 10px;
    border-radius: 10px;
    background: var(--bg);
  }
  .steps li span.n {
    font-family: var(--display);
    font-weight: 800;
    font-size: 22px;
    color: var(--pitch);
    text-align: center;
    line-height: 1.2;
  }
  .steps li div {
    min-width: 0;
  }
  .hintbox {
    margin-top: 12px;
    background: var(--yellow-soft);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .ans {
    margin-top: 14px;
    min-height: 56px;
    border: 2px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    padding: 6px 14px;
    font-family: var(--math);
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    overflow-x: auto;
  }
  .ans:empty::before {
    content: "wpisz wynik";
    color: var(--muted);
    font-family: var(--body);
    font-size: 17px;
  }
  .ans.ok {
    border-color: var(--pitch);
  }
  .ans.bad {
    border-color: var(--red);
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
  }
  .pad button {
    min-height: 52px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-family: var(--math);
    font-size: 24px;
  }
  .pad button.fn {
    font-family: var(--body);
    font-size: 16px;
    font-weight: 700;
  }
  .pad button.go {
    background: var(--pitch);
    color: var(--pitch-ink);
    border-color: var(--pitch);
    font-family: var(--display);
    font-size: 19px;
    font-weight: 800;
  }
  .padnote {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
  }
  .opts {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .opts button {
    text-align: left;
    padding: 12px 14px;
    border-radius: 10px;
    border: 2px solid var(--line);
    background: var(--bg);
    font-size: 17px;
  }
  .opts button[disabled] {
    opacity: 0.45;
    cursor: default;
  }
  .opts button.right {
    border-color: var(--pitch);
    background: var(--pitch-soft);
    opacity: 1;
  }
  .opts button.wrong {
    border-color: var(--red);
    background: var(--red-soft);
  }
  .fb {
    margin-top: 12px;
    border-radius: 10px;
    padding: 10px 12px;
  }
  .fb.ok {
    background: var(--pitch-soft);
  }
  .fb.warn {
    background: var(--yellow-soft);
  }
  .fb.bad {
    background: var(--red-soft);
  }
  .next {
    margin-top: 14px;
    width: 100%;
    min-height: 52px;
    border-radius: 12px;
    border: 0;
    background: var(--pitch);
    color: var(--pitch-ink);
    font-family: var(--display);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.03em;
  }
  .next.ghost {
    background: none;
    border: 2px solid var(--pitch);
    color: var(--pitch);
  }
  .score {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin: 10px 0;
    font-family: var(--display);
    font-weight: 800;
  }
  .score div {
    text-align: center;
  }
  .score b {
    display: block;
    font-size: 64px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .score small {
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .score .colon {
    font-size: 48px;
    color: var(--muted);
  }

  /* obrazek z wyprowadzeniem */
  .scene {
    padding: 12px 12px 14px;
  }
  .dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 4px;
  }
  .dots i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line);
  }
  .dots i.d {
    background: var(--pitch);
  }
  .dots i.c {
    background: var(--yellow);
  }
  .viz {
    display: block;
    width: 100%;
    height: auto;
    max-width: 440px;
    margin: 0 auto;
  }
  .vizh {
    min-height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    font-size: 24px;
    padding: 8px 0;
  }
  .vizh > div {
    transition: opacity 0.45s;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
  }
  .vizh > .t {
    font-size: 18px;
    color: var(--muted);
  }
  .mini .dot {
    fill: var(--pitch);
  }
  .mini .hl {
    fill: var(--yellow);
  }
  .mini text {
    fill: var(--ink);
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
  }
  .cap {
    min-height: 4.6em;
    font-size: 18px;
    text-align: center;
    margin-top: 4px;
    padding: 0 4px;
  }
  .sbtns {
    display: flex;
    gap: 10px;
  }
  .sbtns .next {
    flex: 1;
    margin-top: 8px;
  }
  .sbtns .lektor { width: auto; padding: 0 12px; font-size: 16px; white-space: nowrap; }
  .sbtns .lektor.on { border-color: var(--yellow); }
  .again {
    margin-top: 8px;
    width: 56px;
    border-radius: 12px;
    border: 2px solid var(--line);
    background: var(--bg);
    font-size: 22px;
  }
  .viz .mv,
  .viz text {
    transition:
      transform 0.6s cubic-bezier(0.25, 0.8, 0.3, 1),
      opacity 0.45s;
  }
  .viz .tx {
    fill: var(--ink);
    font-family: var(--math);
  }
  .viz .big2 {
    fill: var(--ink);
    font-family: var(--math);
    font-size: 40px;
  }
  .viz .expb {
    fill: var(--ink);
    font-family: var(--math);
    font-size: 26px;
  }
  .viz .neg {
    fill: var(--red);
  }
  .viz .lb {
    fill: var(--muted);
    font-family: var(--body);
    font-size: 13px;
  }
  .viz .lb2 {
    fill: var(--pitch);
    font-family: var(--math);
    font-size: 17px;
  }
  .viz .val {
    fill: var(--ink);
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
  }
  .viz .res {
    fill: var(--pitch);
    font-family: var(--math);
    font-size: 30px;
  }
  .viz .res2 {
    fill: var(--pitch);
    font-family: var(--math);
    font-size: 24px;
  }
  .viz .tile {
    fill: var(--pitch);
  }
  .viz .tl {
    fill: var(--pitch-ink);
    font-family: var(--math);
  }
  .viz .b .tile {
    fill: var(--blue);
  }
  .viz .y .tile {
    fill: var(--yellow);
  }
  .viz .y .tl {
    fill: var(--on-yellow);
  }
  .viz .r .tile {
    fill: var(--red);
  }
  .viz .d .tile {
    fill: var(--surface);
    stroke: var(--line);
    stroke-width: 1.5;
  }
  .viz .d .tl {
    fill: var(--ink);
  }
  .viz .pl {
    stroke: var(--pitch);
    stroke-width: 2;
    fill: none;
  }
  .viz .arcp {
    fill: none;
    stroke: var(--pitch);
    stroke-width: 2.5;
  }
  .viz .brk {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2;
  }
  .viz .box {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2;
    stroke-dasharray: 5 4;
  }
  .viz .mcirc {
    fill: var(--red);
  }
  .viz .mtxt {
    fill: var(--pitch-ink);
    font-family: var(--math);
    font-size: 24px;
  }
  .viz .fl {
    stroke: var(--ink);
    stroke-width: 2.5;
  }
  .viz .cut {
    stroke: var(--red);
    stroke-width: 3;
  }
  .viz .bar {
    fill: var(--pitch);
  }
  .viz .y .bar {
    fill: var(--yellow);
  }
  .viz .r .bar {
    fill: var(--red);
  }
  .viz .barlab {
    fill: var(--pitch-ink);
    font-family: var(--display);
    font-weight: 800;
    font-size: 16px;
  }
  .viz .y .barlab {
    fill: var(--on-yellow);
  }
  .viz .comma {
    fill: var(--yellow);
    stroke: var(--ink);
    stroke-width: 1.5;
  }
  .viz .zone {
    fill: var(--pitch-soft);
  }
  .viz .mk {
    fill: var(--muted);
  }
  .viz .ok .mk {
    fill: var(--pitch);
  }
  .viz .no .mk {
    fill: var(--red);
  }
  .viz .hl {
    fill: var(--yellow);
  }
  .viz.rys {
    margin: 12px auto 4px;
    max-width: 400px;
  }
  .viz .ln {
    stroke: var(--pitch);
    stroke-width: 2;
    fill: none;
  }
  .viz .siat {
    stroke: var(--pitch);
    stroke-width: 1;
    opacity: 0.3;
  }
  .viz .srf {
    fill: var(--surface);
  }
  .viz .zone2 {
    fill: var(--line);
  }
  .vizh .mix {
    color: var(--muted);
    font-size: 18px;
    text-align: center;
  }
  .viz .valm {
    fill: var(--ink);
    font-family: var(--math);
    font-size: 19px;
  }
  @media (prefers-reduced-motion: reduce) {
    .prog i {
      transition: none;
    }
    .viz *,
    .vizh > div {
      transition: none !important;
    }
  }

  /* logarytmy: indeks dolny i kolory części zapisu */
  .m sub { font-size: 0.68em; line-height: 0; }
  .kol { font-size: 1.15em; }
  .kb { color: var(--blue); font-weight: 600; }
  .kg { color: var(--pitch); font-weight: 600; }
  .kz { background: var(--yellow-soft); color: var(--ink); border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .kol .mix { font-size: 0.7em; }
</style>

<div id="app"></div>

<script type="application/json" id="dane">
{
  "karty": [
    {
      "temat": "1.10 Logarytm i jego własności",
      "strony": "Przykłady 1–5, Ćwiczenia 1–7, Zadania 1–9",
      "kolejki": [
        1,
        2,
        3,
        4
      ]
    }
  ],
  "sciaga": [
    "$log_{a} b = x$ znaczy $a^{x} = b$. Podstawa logarytmu zostaje podstawą potęgi.",

<script>
  /* Schematy do zadań z treścią: rysują zależność z zadania (kafelki, pasek, kratka, połówki), bez ozdób. */
  window.RYS = (function () {
    function e(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function t(x, y, s, cls, extra) {
      return (
        '<text x="' + x + '" y="' + y + '" class="' + (cls || "lb") +

        ((extra && extra.attr) || "") + ">" + e(s) + "</text>"

        '<g class="' + (kol || "") + '">' + rect(x - w / 2, y - h / 2, w, h, "tile", 6) +

      );
    }
    /* klamra pod odcinkiem (dol) albo nad nim (gora) */
    function klamra(x1, x2, y, gora) {
      var d = gora ? 6 : -6;
      return (
        '<path class="brk" d="M' + x1 + " " + (y + d) + " L" + x1 + " " + y +
        " L" + x2 + " " + y + " L" + x2 + " " + (y + d) + '"></path>'
      );
    }
    var R = {};

    /* kafelki: każdy to jedno mnożenie, grupy podpisane klamrą */
    R.grupy = function (r) {
      var w = 30, g = 6, lw = r.lead ? 52 : 0, n = 0, h = "";
      r.grupy.forEach(function (q) {
        n += q.n;
      });
      var tot = (r.lead ? lw + 2 * g : 0) + n * w + (n - 1) * g + (r.grupy.length - 1) * 10;
      var x = 170 - tot / 2;

      r.grupy.forEach(function (q) {
        var x0 = x;
        for (var i = 0; i < q.n; i++) {
          h += tile(x + w / 2, 66, w, 38, q.lab, q.kol);
          x += w + g;
        }
        h += klamra(x0, x - g, 96) + t((x0 + x - g) / 2, 116, q.pod, "lb");
        x += 10;
      });
      if (r.wynik) h += t(170, 156, r.wynik, "res2");
      return [h, 170];
    };

    /* prostokąt albo kwadrat z podpisanymi bokami, opcjonalnie w kratkę */
    R.prost = function (r) {
      var W = r.w || 150, H = r.h || 150, x = 170 - W / 2 + 12, y = 38, h = "", i;
      h += rect(x, y, W, H, "zone", 4);
      for (i = 1; i < (r.kol || 0); i++)

      for (i = 1; i < (r.wier || 0); i++)

      });
      if (r.srodek) {
        h += rect(x + W / 2 - 62, y + H / 2 - 16, 124, 30, "srf", 6);
        h += t(x + W / 2, y + H / 2 + 6, r.srodek, "valm");

    R.kostka = function (r) {

      function pg(pts, cls) {

      h += t(x + s / 2, y + s + 22, r.a, "valm");
      h += t(x + s + d + 30, y + s / 2 - d / 2 + 6, r.a, "valm");
      h += t(x + s / 2 + d / 2, y - d - 8, r.a, "valm");
      h += t(170, y + s + 56, r.srodek, "res2");

    R.pasek = function (r) {

      for (i = 0; i < r.n; i++) {

          P.push([cx, cy, cw, ch / 2]);
          cy += ch / 2;
          ch /= 2;

      P.forEach(function (p, i) {
        h += rect(p[0], p[1], p[2], p[3], i === r.n - 1 ? "hl" : "zone", 0) + rect(p[0], p[1], p[2], p[3], "ln", 0);

      h += rect(cx, cy, cw, ch, "ln", 0);
      if (r.gora) h += t(170, 22, r.gora, "lb");
      if (r.dol) h += t(170, y + H + 30, r.dol, "res2");
      return [h, y + H + 44];

    /* słupki: każdy następny to połowa poprzedniego */
    R.spadek = function (r) {

      for (i = 0; i < n; i++) {
        var cx = 20 + gap * i + gap / 2, hh = Math.max(H * Math.pow(0.5, i), 2), ost = i === n - 1;
        h += rect(cx - bw / 2, base - hh, bw, hh, ost ? "hl" : "bar", 2);
        h += t(cx, base - hh - 8, r.wart[i], "val");
        h += t(cx, base + 18, r.czas[i], "lb");
        if (i) h += t(cx - gap / 2, 22, "· ½", "lb2");
      }
      h += line(14, base, 326, base, "ln");
      if (r.dol) h += t(170, base + 48, r.dol, "lb");
      return [h, base + 60];
    };

    return function (r) {
      var o = R[r.typ](r);
      return (
        '<svg class="viz rys" viewBox="0 0 340 ' + o[1] + '" role="img" aria-label="' +
        e(r.opis || "Schemat do zadania") + '">' + o[0] + "</svg>"
      );
    };
  })();
</script>

<script>
  /* Sprawdzian ze wszystkich lekcji: zadania otwarte bez sprawdzania na stronie; odpowiedzi idą do taty, a sprawdza je AI z kluczem spoza strony. */
  window.SPR = (function () {
    var D = JSON.parse(document.getElementById("sprawdzian").textContent),
      MIEJSCE = "logarytmy-test-v1",
      ZNAKI = ["log_", "^", "/", "√", "·", "(", ")", "−"],
      app = document.getElementById("app"),
      S = load(),
      clockT = null,
      pytaj = false,
      wysylam = false,
      komunikat = "";

    function load() {
      try {
        var r = JSON.parse(localStorage.getItem(MIEJSCE) || "null");
        if (r && r.odp) return r;
      } catch (e) {}
      return { odp: {} };
    }
    function save() {
      try {
        localStorage.setItem(MIEJSCE, JSON.stringify(S));
      } catch (e) {}
    }
    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function sumaPkt() {
      return D.zadania.reduce(function (a, z) {
        return a + z.pkt;
      }, 0);
    }
    function pusta(z) {
      return !(S.odp[z.nr] || "").trim();
    }

    /* zapis matematyki ze strony na zwykły tekst dla AI: ~f{a}{b} → a/b, ~r{n}{x} → n√(x), ~p{x} → (x), ^{x} → ^x */
    function plain(s) {
      var i = 0;
      function nawias(x) {
        return /^[0-9a-z?]+$/i.test(x) ? x : "(" + x + ")";
      }
      function grp() {
        if (s[i] === "{") {
          i++;
          var o = seq("}");
          i++;
          return o;
        }
        return s[i++] || "";
      }
      function seq(end) {
        var o = "";
        while (i < s.length && !(end && s[i] === end)) {
          var c = s[i];
          if (c === "$") i++;
          else if (c === "^") {
            i++;
            o += "^" + nawias(grp());
          } else if (c === "_") {
            i++;
            o += "_" + nawias(grp());
          } else if (c === "~" && "frp".indexOf(s[i + 1]) >= 0) {
            var k = s[i + 1];
            i += 2;
            if (k === "f") {
              var a = grp();
              o += nawias(a) + "/" + nawias(grp());
            } else if (k === "r") {
              var n = grp();
              o += ({ "": "√", 3: "∛", 4: "∜", 5: "⁵√" }[n] || n + "√") + nawias(grp());
            } else o += "(" + grp() + ")";
          } else if (c === "*") {
            o += "·";
            i++;
          } else if (c === "-") {
            o += "−";
            i++;
          } else {
            o += c;
            i++;
          }
        }
        return o;
      }
      return seq(null);
    }

    function czas() {
      var s = Math.max(
        0,
        Math.floor(((S.koniec || Date.now()) - S.start) / 1000),
      );
      return (
        String(Math.floor(s / 60)).padStart(2, "0") +
        ":" +
        String(s % 60).padStart(2, "0")
      );
    }
    function tick() {
      var el = document.getElementById("sprClock");
      if (el && S.start) el.textContent = czas();
    }
    function pokaz(h) {
      clearInterval(clockT);
      app.innerHTML = h;
      window.scrollTo(0, 0);
    }

    function wejscie() {
      return (
        '<section><h2>Sprawdzian</h2><div class="card"><b>' +
        esc(D.tytul) +
        "</b>" +
        '<p class="spr-info">' +
        D.zadania.length +
        " zadań z lekcji 1–4, " +
        sumaPkt() +
        " punktów, około " +
        D.czas_min +
        " minut. Bez podpowiedzi. Na końcu wysyłasz odpowiedzi tacie.</p>" +
        '<button class="next" data-spr="wstep">' +
        (S.start ? "Wróć do sprawdzianu" : "Otwórz sprawdzian") +
        "</button></div></section>"
      );
    }

    function wstep() {
      pokaz(
        '<div class="top"><div class="wrap"><span class="ttl">' +
          esc(D.tytul) +
          '</span><button class="x" data-spr="dom" aria-label="Wróć do listy lekcji">×</button></div></div>' +
          '<main class="wrap"><div class="stage">Zanim zaczniesz</div><div class="card">' +
          "<p>" +
          D.zadania.length +
          " zadań ze wszystkich lekcji, razem " +
          sumaPkt() +
          " punktów. Masz około " +
          D.czas_min +
          " minut.</p>" +
          "<p>Wpisz obliczenia i wynik. Punkty dostajesz też za dobre obliczenia, nawet gdy wynik wyjdzie zły. Strona nie sprawdza odpowiedzi: na końcu wyślesz je tacie.</p>" +
          '<div class="hintbox"><b>Jak pisać:</b> logarytm log_2 8, potęga 2^3, ułamek 3/4, pierwiastek √2. Przy każdym zadaniu zapisz, jak liczysz, na przykład przepisanie na potęgę. Te znaki są też na przyciskach nad polem.</div>' +
          '<button class="next" data-spr="zadania">' +
          (S.start ? "Wróć do zadań" : "Zacznij sprawdzian") +
          "</button></div></main>",
      );
    }

    function zadania() {
      if (!S.start) {
        S.start = Date.now();
        save();
      }
      S.koniec = null;
      var h =
        '<div class="top"><div class="wrap"><span class="ttl">' +
        esc(D.tytul) +
        '</span><span class="clock" id="sprClock">00:00</span><button class="x" data-spr="dom" aria-label="Wróć do listy lekcji">×</button></div></div><main class="wrap">';
      D.zadania.forEach(function (z) {
        h +=
          '<div class="stage">Zadanie ' +
          z.nr +
          " · " +
          z.pkt +
          " pkt</div>" +
          '<div class="card"><div class="prompt">' +
          window.MT(z.t) +
          "</div>" +
          (z.rys ? window.RYS(z.rys) : "") +
          '<div class="spr-kl">' +
          ZNAKI.map(function (c) {
            return (
              '<button data-wstaw="' +
              esc(c) +
              '" data-z="' +
              z.nr +
              '" aria-label="Wstaw znak ' +
              esc(c) +
              '">' +
              esc(c) +
              "</button>"
            );
          }).join("") +
          "</div>" +
          '<textarea class="spr-pole" id="spr' +
          z.nr +
          '" data-z="' +
          z.nr +
          '" rows="3" placeholder="obliczenia i wynik" aria-label="Odpowiedź do zadania ' +
          z.nr +
          '">' +
          esc(S.odp[z.nr] || "") +
          "</textarea></div>";
      });
      h +=
        '<button class="next" data-spr="koniec">Zakończ i wyślij</button></main>';
      pokaz(h);
      tick();
      clockT = setInterval(tick, 1000);
    }

    function tekst() {
      var t =
        D.tytul +
        " (" +
        D.zakres +
        ")\nOddane: " +
        new Date(S.koniec).toLocaleString("pl-PL") +
        "\nCzas: " +
        czas() +
        "\n";
      D.zadania.forEach(function (z) {
        t +=
          "\nZadanie " +
          z.nr +
          " (" +
          z.pkt +
          " pkt): " +
          plain(z.t) +
          "\nOdpowiedź: " +
          (pusta(z) ? "(brak)" : S.odp[z.nr].trim()) +
          "\n";
      });
      return t;
    }

    function koniec() {
      var puste = D.zadania.filter(pusta).map(function (z) {
          return z.nr;
        }),
        h =
          '<div class="top"><div class="wrap"><span class="ttl">' +
          esc(D.tytul) +
          '</span><button class="x" data-spr="dom" aria-label="Wróć do listy lekcji">×</button></div></div>' +
          '<main class="wrap"><div class="stage">Wyślij odpowiedzi</div><div class="card">' +
          "<p>Odpowiedzi w " +
          (D.zadania.length - puste.length) +
          " z " +
          D.zadania.length +
          " zadań. Czas: " +
          czas() +
          ".</p>";
      if (puste.length)
        h +=
          '<div class="hintbox">Puste zadania: ' +
          puste.join(", ") +
          '. <button class="linkbtn" data-spr="zadania">Wróć do zadań</button></div>';
      h +=
        '<button class="next" data-spr="wyslij">Wyślij odpowiedzi tacie</button>' +
        '<button class="next ghost" data-spr="kopiuj">Kopiuj tekst</button>' +
        (komunikat
          ? '<p class="spr-info" aria-live="polite">' + esc(komunikat) + "</p>"
          : "") +
        '<div class="spr-tekst" id="sprTekst">' +
        esc(tekst()) +
        "</div></div>" +
        '<div class="reset">' +
        (pytaj
          ? 'Na pewno zacząć od nowa? Odpowiedzi znikną. <button class="linkbtn" data-spr="zeruj">Tak, od nowa</button><button class="linkbtn" data-spr="niezeruj">Nie</button>'
          : '<button class="linkbtn" data-spr="pytaj">Zacznij sprawdzian od nowa</button>') +
        ' <button class="linkbtn" data-spr="zadania">Wróć do zadań</button></div></main>';
      komunikat = "";
      pokaz(h);
    }

    /* kopiuje tekst do schowka; obietnica daje true, gdy kopiowanie się udało */
    function kopiuj(t) {
      function stary() {
        var el = document.createElement("textarea"),
          ok = false;
        el.value = t;
        document.body.appendChild(el);
        el.select();
        try {
          ok = document.execCommand("copy");
        } catch (e) {}
        document.body.removeChild(el);
        return ok;
      }
      if (navigator.clipboard && navigator.clipboard.writeText)
        return navigator.clipboard.writeText(t).then(function () {
          return true;
        }, stary);
      return Promise.resolve(stary());
    }
    function poKopii(ok, przed) {
      komunikat =
        przed +
        (ok
          ? "Tekst skopiowany. Wklej go w wiadomości do taty."
          : "Nie udało się skopiować. Zaznacz tekst poniżej, skopiuj go i wklej w wiadomości do taty.");
      koniec();
    }

    var AKCJE = {
      wstep: wstep,
      zadania: zadania,
      koniec: function () {
        S.koniec = Date.now();
        save();
        koniec();
      },
      dom: function () {
        clearInterval(clockT);
        window.HOME();
      },
      wyslij: function () {
        if (wysylam) return;
        var t = tekst();
        if (!navigator.share) {
          kopiuj(t).then(function (ok) {
            poKopii(ok, "");
          });
          return;
        }
        wysylam = true;
        navigator.share({ title: D.tytul, text: t }).then(
          function () {
            wysylam = false;
          },
          function (e) {
            wysylam = false;
            if (e && e.name === "AbortError") return;
            kopiuj(t).then(function (ok) {
              poKopii(ok, "Nie udało się otworzyć wysyłania. ");
            });
          },
        );
      },
      kopiuj: function () {
        kopiuj(tekst()).then(function (ok) {
          poKopii(ok, "");
        });
      },
      pytaj: function () {
        pytaj = true;
        koniec();
      },
      niezeruj: function () {
        pytaj = false;
        koniec();
      },
      zeruj: function () {
        pytaj = false;
        S = { odp: {} };
        save();
        wstep();
      },
    };

    /* przycisk znaku nie zabiera kursora z pola, a wstawia znak w miejscu kursora */
    document.addEventListener("mousedown", function (e) {
      if (e.target.closest && e.target.closest("[data-wstaw]"))
        e.preventDefault();
    });
    document.addEventListener("click", function (e) {
      var b = e.target.closest && e.target.closest("[data-spr], [data-wstaw]");
      if (!b) return;
      if (b.hasAttribute("data-spr")) {
        var f = AKCJE[b.getAttribute("data-spr")];
        if (f) f();
        return;
      }
      var p = document.getElementById("spr" + b.getAttribute("data-z")),
        c = b.getAttribute("data-wstaw"),
        // pole bez kursora (np. po powrocie do zadań) dostaje znak na końcu, nie na początku
        aktywne = document.activeElement === p && p.selectionStart != null,
        a = aktywne ? p.selectionStart : p.value.length,
        z = aktywne ? p.selectionEnd : a;
      p.value = p.value.slice(0, a) + c + p.value.slice(z);
      p.focus();
      p.selectionStart = p.selectionEnd = a + c.length;
      S.odp[p.getAttribute("data-z")] = p.value;
      save();
    });
    document.addEventListener("input", function (e) {
      if (e.target.classList && e.target.classList.contains("spr-pole")) {
        S.odp[e.target.getAttribute("data-z")] = e.target.value;
        save();
      }
    });

    return { wejscie: wejscie, plain: plain };
  })();
</script>

                "</span><span>" +
                b +
                "</span></span>";
            } else if (k === "r") {
              var n = grp(),
                x = grp();
              o +=
                '<span class="rt">' +
                (n ? '<span class="ri">' + n + "</span>" : "") +
                '<span class="rs">√</span><span class="rx">' +
                x +
                "</span></span>";
            } else {
              var y = grp();
              o +=
                '<span class="pa">(</span>' + y + '<span class="pa">)</span>';
            }
          } else if (c === "-") {
            o += "−";
            i++;
          } else if (c === "*") {
            o += "·";
            i++;
          } else {
            o += esc(c);
            i++;
          }
        }
        return o;
      }
      return '<span class="m">' + seq(null) + "</span>";
    }
    function T(t) {
      return String(t)
        .split("$")
        .map(function (p, j) {
          return j % 2 ? M(p) : p.replace(/[&<>"]/g, esc);
        })
        .join("");
    }
    window.MT = T;
    window.HOME = home;

    function dec(s) {
      var neg = s[0] === "-";
      if (neg) s = s.slice(1);
      var parts = s.split("."),
        w = parts[0] || "0",
        f = parts[1] || "";
      var d = Math.pow(10, f.length);
      return { n: (neg ? -1 : 1) * (Number(w) * d + Number(f || 0)), d: d };
    }
    function rat(str) {
      str = String(str)
        .trim()
        .replace(/−/g, "-")
        .replace(/,/g, ".")
        .replace(/\s/g, "");
      if (!/^-?\d+(\.\d+)?(\/-?\d+(\.\d+)?)?$/.test(str)) return null;
      var p = str.split("/"),
        x = dec(p[0]),
        y = dec(p[1] || "1");
      if (y.n === 0) return null;
      return { n: x.n * y.d, d: x.d * y.n };
    }
    function eq(a, b) {
      return !!(a && b) && a.n * b.d === b.n * a.d;
    }
    function fmtAns(a) {
      if (a.indexOf("/") >= 0) {
        var p = a.split("/"),
          neg = p[0][0] === "-";
        return M(
          (neg ? "-" : "") + "~f{" + p[0].replace("-", "") + "}{" + p[1] + "}",
        );
      }
      return M(a.replace(".", ","));
    }
    function showIn(v) {
      return v ? M(v) : "";
    }

    function session(nr) {
      for (var i = 0; i < D.sesje.length; i++)
        if (D.sesje[i].nr === nr) return D.sesje[i];
    }
    function nextNr() {
      for (var i = 0; i < D.sesje.length; i++)
        if (D.sesje[i].poprawka && !S.done[D.sesje[i].nr]) return D.sesje[i].nr;
      for (var j = 0; j < D.sesje.length; j++)
        if (!D.sesje[j].poprawka && !S.done[D.sesje[j].nr]) return D.sesje[j].nr;
      return null;
    }

    function home() {
      P = null;
      clearInterval(clockT);
      SC.clearT();
      lektorStop();
      var nx = nextNr(),
        total = D.sesje.filter(function (s) { return !s.poprawka; }).length,

        h +=

          T(s.tytul) + "</b><small>" + T(s.opis) + "</small></span>" +
          (S.done[s.nr]

            : s.nr === nx

          "</button>";
      });
      if (D.sesje.some(function (s) { return s.poprawka; })) h += "</div></section>";
      h += '<section><h2>Lekcje</h2><div class="table">';
      D.sesje.forEach(function (s) {

        var d = S.done[s.nr],

          : isNext
            ? '<span class="chip go">Zacznij</span>'
            : '<span class="chip">Otwórz</span>';
        h +=
          '<button class="row' +
          (isNext ? " biezaca" : "") +
          '" data-go="' +
          s.nr +
          '"><span class="nr">' +
          s.nr +
          '</span><span class="tt"><b>' +
          T(s.tytul) +
          "</b><small>Podręcznik, rozdz. " +

          "</small></span>" +
          chip +
          "</button>";
      });
      h += "</div></section>";
      h += window.SPR ? window.SPR.wejscie() : "";
      h +=
        '<section><h2>Jedna lekcja</h2><div class="flow"><span>Skąd to się bierze</span><i>→</i><span>Przykład</span><i>→</i><span>Ćwiczenia</span><i>→</i><span>Test</span></div>' +
        '<p class="note">Przy złej odpowiedzi w ćwiczeniach dostajesz podpowiedź. Lekcje rób po kolei.</p></section>';
      h += '<section><h2>Zakres z podręcznika</h2><div class="cards">';
      D.karty.forEach(function (k) {
        h +=
          '<div class="topic"><b>' +
          k.temat +
          "</b><small>" +
          k.strony +
          " · lekcje " +
          k.kolejki.join(", ") +
          "</small></div>";
      });
      h += "</div></section>";
      h +=
        '<section><details class="sciaga"><summary>Ściąga: wszystkie zasady</summary><ul>' +
        D.sciaga
          .map(function (x) {
            return "<li>" + T(x) + "</li>";
          })
          .join("") +
        "</ul></details></section>";
      h +=
        '<div class="reset">' +
        (askReset
          ? 'Na pewno wyzerować postępy? <button class="linkbtn" id="rsYes">Tak, zeruj</button><button class="linkbtn" id="rsNo">Nie</button>'
          : '<button class="linkbtn" id="rs">Wyzeruj postępy</button>') +
        "</div>";
      h += "</main>";
      app.innerHTML = h;
      app.querySelectorAll("[data-go]").forEach(function (b) {
        b.onclick = function () {
          start(+b.getAttribute("data-go"));
        };
      });
      var r = document.getElementById("rs");
      if (r)
        r.onclick = function () {
          askReset = true;
          home();
        };
      var y = document.getElementById("rsYes");
      if (y)
        y.onclick = function () {
          S = { done: {}, best: {} };
          save();
          askReset = false;
          home();
        };
      var n = document.getElementById("rsNo");
      if (n)
        n.onclick = function () {
          askReset = false;
          home();
        };
    }

    function start(nr) {
      LK.on = false;
      lektorStop();
      var s = session(nr),
        st = [];
      (s.rozgrzewka || []).forEach(function (q, j, a) {
        st.push({
          type: "q",
          stage: "Powtórka",
          mode: "train",
          q: q,
          j: j,
          n: a.length,
        });
      });
      if (s.bloki)
        s.bloki.forEach(function (b) {
          st.push({ type: "sceny", stage: b.tytul, list: b.sceny });
          b.pytania.forEach(function (q, j, a) {
            st.push({
              type: "q",
              stage: "Sprawdź się",
              mode: "train",
              q: q,
              j: j,
              n: a.length,
            });
          });
        });
      else if (s.sceny)
        st.push({
          type: "sceny",
          stage: s.final ? "Przypomnienie" : "Skąd to się bierze",
          list: s.sceny,
        });
      if (s.przyklad)
        st.push({ type: "kroki", stage: "Przykład krok po kroku" });
      if (s.razem)
        st.push({
          type: "q",
          stage: "Razem",
          mode: "razem",
          q: s.razem,
          j: 0,
          n: 1,
        });
      (s.trening || []).forEach(function (q, j, a) {
        st.push({
          type: "q",
          stage: "Ćwiczenia",
          mode: "train",
          q: q,
          j: j,
          n: a.length,
        });
      });
      s.test.forEach(function (q, j, a) {
        st.push({
          type: "q",
          stage: s.final ? "Test końcowy" : "Test",
          mode: "test",
          q: q,
          j: j,
          n: a.length,
        });
      });
      st.push({ type: "wynik", stage: "Wynik" });
      P = {
        s: s,
        st: st,
        i: 0,
        ok: 0,
        miss: [],
        t0: Date.now(),
        saved: false,
        sc: 0,
        ss: 0,
      };
      resetQ();
      render();
      clearInterval(clockT);
      clockT = setInterval(tick, 1000);
    }
    function resetQ() {
      if (P) {
        P.tries = 0;
        P.input = "";
        P.done = false;
        P.fb = "";
        P.out = {};
        P.shown = 1;
      }
    }
    function tick() {
      var el = document.getElementById("clock");
      if (!el || !P) return;
      var s = Math.floor((Date.now() - P.t0) / 1000);
      el.textContent =
        String(Math.floor(s / 60)).padStart(2, "0") +
        ":" +
        String(s % 60).padStart(2, "0");
    }
    function go() {
      P.i++;
      P.sc = 0;
      P.ss = 0;
      resetQ();
      render();
      window.scrollTo(0, 0);
    }

    function render() {
      if (!P) {
        home();
        return;
      }
      SC.clearT();
      lektorStop();
      var st = P.st[P.i],
        s = P.s;
      var h =
        '<div class="top"><div class="wrap"><span class="ttl">' +
        (s.poprawka ? "Poprawa" : "Lekcja " + s.nr) +
        " · " +
        T(s.tytul) +
        '</span><span class="clock" id="clock">00:00</span><button class="x" id="quit" aria-label="Wróć do listy lekcji">×</button></div><div class="prog"><i style="width:' +
        Math.round((100 * P.i) / (P.st.length - 1)) +
        '%"></i></div></div><main class="wrap">';
      var label =
        st.stage +
        (st.type === "q" && st.n > 1 ? " · " + (st.j + 1) + "/" + st.n : "") +
        (st.type === "sceny" ? " · " + (P.sc + 1) + "/" + st.list.length : "");
      h += '<div class="stage">' + label + "</div>";
      if (st.type === "sceny") h += scena(s);
      else if (st.type === "kroki") h += kroki(s);
      else if (st.type === "q") h += question(st);
      else h += wynik(s);
      h += "</main>";
      app.innerHTML = h;
      tick();
      document.getElementById("quit").onclick = home;
      bind(st);
    }

    function sLab() {
      var s = P.s,
        list = P.st[P.i].list,
        nx = P.st[P.i + 1],
        sc = SC[list[P.sc]],
        step = sc.steps[P.ss];
      if (step[1]) return step[1];
      if (P.sc < list.length - 1) return "Dalej";
      if (nx && nx.stage === "Sprawdź się") return "Sprawdź się";
      if (nx && nx.type === "kroki") return "Do przykładu";
      return s.final ? "Do testu" : "Dalej";
    }
    /* lektor: przycisk przy obrazku czyta krok; raz włączony gra przy każdym kolejnym kroku tej wizyty */
    var LK = { on: false, a: null };
    function lektorStop() {
      if (LK.a) {
        LK.a.pause();
        LK.a = null;
      }
    }
    function lektorBtn(key) {
      return window.LEKTOR && LEKTOR[key]
        ? '<button class="again lektor' + (LK.on ? " on" : "") + '" id="lek" aria-pressed="' + LK.on + '">' + (LK.on ? "■ Lektor" : "▶ Lektor") + "</button>"
        : "";
    }
    function lektorGraj(key, k) {
      lektorStop();
      var f = window.LEKTOR && LEKTOR[key] && LEKTOR[key][k];
      if (!LK.on || !f) return;
      LK.a = new Audio(f);
      LK.a.play().catch(function () {});
    }
    function scena(s) {
      var list = P.st[P.i].list,
        sc = SC[list[P.sc]];
      var h =
        '<div class="card scene"><div class="dots">' +
        list
          .map(function (_, i) {
            return (
              '<i class="' + (i < P.sc ? "d" : i === P.sc ? "c" : "") + '"></i>'
            );
          })
          .join("") +
        "</div>";
      h += sc.html
        ? '<div class="vizh" id="viz"></div>'
        : '<svg class="viz" id="viz" viewBox="0 0 340 230" role="img" aria-label="Rysunek do zasady"></svg>';
      h +=
        '<div class="cap" id="cap" aria-live="polite">' +
        T(sc.steps[P.ss][0]) +
        "</div>";
      return (
        h +
        '<div class="sbtns"><button class="again" id="replay" aria-label="Od początku">↺</button>' + lektorBtn(list[P.sc]) + '<button class="next" id="nx">' +
        sLab() +
        "</button></div></div>"
      );
    }
    function setupScene() {
      var s = P.s,
        list = P.st[P.i].list,
        sc = SC[list[P.sc]],
        upd = sc.build(document.getElementById("viz"));
      upd(P.ss);
      lektorGraj(list[P.sc], P.ss);
      var lb = document.getElementById("lek");
      if (lb) lb.onclick = function () { LK.on = !LK.on; lb.className = "again lektor" + (LK.on ? " on" : ""); lb.setAttribute("aria-pressed", LK.on); lb.textContent = LK.on ? "■ Lektor" : "▶ Lektor"; if (LK.on) lektorGraj(list[P.sc], P.ss); else lektorStop(); };
      document.getElementById("replay").onclick = function () {
        P.ss = 0;
        render();
      };
      document.getElementById("nx").onclick = function () {
        if (P.ss < sc.steps.length - 1) {
          P.ss++;
          upd(P.ss);
          lektorGraj(list[P.sc], P.ss);
          document.getElementById("cap").innerHTML = T(sc.steps[P.ss][0]);
          this.textContent = sLab();
        } else if (P.sc < list.length - 1) {
          P.sc++;
          P.ss = 0;
          render();
        } else go();
      };
    }
    function kroki(s) {
      var p = s.przyklad,
        h =
          '<div class="card"><div class="prompt">' +
          T(p.t) +
          '</div><ol class="steps">';
      for (var k = 0; k < P.shown; k++)
        h +=
          '<li><span class="n">' +
          (k + 1) +
          "</span><div>" +
          T(p.kroki[k]) +
          "</div></li>";
      h += "</ol>";
      h +=
        P.shown < p.kroki.length
          ? '<button class="next ghost" id="more">Pokaż krok ' +
            (P.shown + 1) +
            "</button>"
          : '<button class="next" id="nx">Dalej: twoja kolej</button>';
      return h + "</div>";
    }
    function question(st) {
      var q = st.q,
        h = '<div class="card"><div class="prompt">' + T(q.t) + "</div>";
      if (q.rys) h += window.RYS(q.rys);
      if (st.mode === "razem")
        h += '<div class="hintbox"><b>Podpowiedź:</b> ' + T(q.hint) + "</div>";
      if (q.opts) {
        h +=
          '<div class="opts">' +
          q.opts
            .map(function (o, k) {
              var c = P.out[k] || "";
              return (
                '<button data-opt="' +
                k +
                '" class="' +
                c +
                '"' +
                (P.done || c === "wrong" ? " disabled" : "") +
                ">" +
                T(o) +
                "</button>"
              );
            })
            .join("") +
          "</div>";
      } else {
        h +=
          '<div class="ans' +
          (P.done ? (P.right ? " ok" : " bad") : "") +
          '" id="ans" aria-live="polite">' +
          showIn(P.input) +
          "</div>";
        if (!P.done) {
          var keys = [
            "7",
            "8",
            "9",
            "⌫",
            "4",
            "5",
            "6",
            "/",
            "1",
            "2",
            "3",
            ",",
            "−",
            "0",
            "C",
            "OK",
          ];
          h +=
            '<div class="pad">' +
            keys
              .map(function (k) {
                var cls =
                  k === "OK" ? "go" : k === "⌫" || k === "C" ? "fn" : "";
                var lab =
                  k === "OK"
                    ? "Sprawdź"
                    : k === "C"
                      ? "Wyczyść"
                      : k === "/"
                        ? "ułamek"
                        : k;
                return (
                  '<button class="' +
                  cls +
                  '" data-k="' +
                  k +
                  '" aria-label="' +
                  lab +
                  '">' +
                  (k === "OK" ? "Sprawdź" : k) +
                  "</button>"
                );
              })
              .join("") +
            "</div>";
          h +=
            '<div class="padnote">Ułamek wpisz jak 3/4, liczbę dziesiętną z przecinkiem.</div>';
        }
      }
      if (P.fb) h += P.fb;
      if (P.done) h += '<button class="next" id="nx">Dalej</button>';
      return h + "</div>";
    }
    function wynik(s) {
      if (!P.saved) {
        P.saved = true;
        S.done[s.nr] = true;
        S.best[s.nr] = Math.max(S.best[s.nr] || 0, P.ok);
        save();
        clearInterval(clockT);
      }
      var n = s.test.length,
        bad = n - P.ok,
        h = '<div class="card" style="text-align:center">';
      h += "<h3>" + (s.poprawka ? "Poprawa" : "Lekcja " + s.nr) + " zrobiona</h3>";
      h +=
        '<div class="score"><div><b>' +
        P.ok +
        '</b><small>dobrze</small></div><span class="colon">:</span><div><b>' +
        bad +
        "</b><small>źle</small></div></div>";
      var msg =
        bad === 0
          ? "Wszystko dobrze. Ten temat masz opanowany."
          : P.ok >= n - 1
            ? "Prawie wszystko. Przejrzyj jeszcze rozwiązanie zadania z błędem."
            : "Jutro zrób tę lekcję jeszcze raz, zanim przejdziesz dalej.";
      if (s.final && bad > 0) {
        var ks = [];
        P.miss.forEach(function (k) {
          if (ks.indexOf(k) < 0) ks.push(k);
        });
        ks.sort();
        msg =
          "Powtórz: " +
          ks
            .map(function (k) {
              return "lekcja " + k + " (" + session(k).tytul + ")";
            })
            .join(", ") +
          ". Potem zrób test jeszcze raz.";
      }
      if (s.final && bad === 0)
        msg = "Komplet. Cały materiał o logarytmach opanowany.";
      h += "<p>" + msg + "</p>";
      h +=
        '<button class="next" id="home">Wróć do listy lekcji</button><button class="next ghost" id="again">Zrób tę lekcję jeszcze raz</button></div>';
      return h;
    }

    function bind(st) {
      var nx = document.getElementById("nx");
      if (nx) nx.onclick = go;
      var more = document.getElementById("more");
      if (more)
        more.onclick = function () {
          P.shown++;
          render();
        };
      var hm = document.getElementById("home");
      if (hm) hm.onclick = home;
      var ag = document.getElementById("again");
      if (ag)
        ag.onclick = function () {
          start(P.s.nr);
        };
      app.querySelectorAll("[data-opt]").forEach(function (b) {
        b.onclick = function () {
          check(+b.getAttribute("data-opt"));
        };
      });
      app.querySelectorAll("[data-k]").forEach(function (b) {
        b.onclick = function () {
          key(b.getAttribute("data-k"));
        };
      });
      if (st.type === "sceny") setupScene();
    }
    function key(k) {
      if (!P || P.done) return;
      if (k === "OK") {
        check();
        return;
      }
      if (k === "⌫") P.input = P.input.slice(0, -1);
      else if (k === "C") P.input = "";
      else if (k === "−") {
        P.input += "-";
      } else if (P.input.length < 14) P.input += k;
      var a = document.getElementById("ans");
      if (a) a.innerHTML = showIn(P.input);
    }
    function check(choice) {
      var st = P.st[P.i],
        q = st.q,
        right;
      if (P.done) return;
      if (q.opts) right = choice === q.ok;
      else {
        var r = rat(P.input);
        if (!r) {
          P.fb =
            '<div class="fb warn">Wpisz liczbę: całą, ułamek jak 3/4 albo dziesiętną z przecinkiem, np. 0,6.</div>';
          render();
          return;
        }
        right = eq(r, rat(q.a));
      }
      P.tries++;
      if (right) {
        P.done = true;
        P.right = true;
        if (q.opts) P.out[choice] = "right";
        if (st.mode === "test") P.ok++;
        P.fb = '<div class="fb ok"><b>Dobrze.</b> ' + T(q.sol || "") + "</div>";
      } else if (st.mode !== "test" && P.tries < 2) {
        if (q.opts) P.out[choice] = "wrong";
        P.fb =
          '<div class="fb warn"><b>Jeszcze nie.</b> ' +
          T(q.hint || "Sprawdź jeszcze raz znak i wykładnik.") +
          " Spróbuj jeszcze raz.</div>";
      } else {
        P.done = true;
        P.right = false;
        if (q.opts) {
          P.out[choice] = "wrong";
          P.out[q.ok] = "right";
        }
        if (st.mode === "test" && q.k) P.miss.push(q.k);
        P.fb =
          '<div class="fb bad"><b>Źle.</b> Poprawnie: ' +
          (q.opts ? T(q.opts[q.ok]) : fmtAns(q.a)) +
          ". " +
          T(q.sol || "") +
          "</div>";
      }
      render();
    }
    document.addEventListener("keydown", function (e) {
      if (!P) return;
      var st = P.st[P.i];
      if (e.key === "Enter") {
        var nx =
          document.getElementById("nx") || document.getElementById("more");
        if (nx && (st.type !== "q" || P.done)) {
          e.preventDefault();
          nx.click();
          return;
        }
      }
      if (st.type !== "q" || st.q.opts || P.done) return;
      if (/^[0-9]$/.test(e.key)) key(e.key);
      else if (e.key === "," || e.key === ".") key(",");
      else if (e.key === "/") key("/");
      else if (e.key === "-") key("−");
      else if (e.key === "Backspace") key("⌫");
      else if (e.key === "Enter") key("OK");
      else return;
      e.preventDefault();
    });
    home();
  })();
</script>
